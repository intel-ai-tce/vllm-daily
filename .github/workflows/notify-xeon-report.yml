name: Notify Teams when a Xeon report is merged

on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: read
  pull-requests: read

jobs:
  notify-teams:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'xeon-report')
    runs-on: ubuntu-latest

    steps:
      - name: Send Teams notification
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          if [[ -z "$TEAMS_WEBHOOK_URL" ]]; then
            echo "TEAMS_WEBHOOK_URL is not configured" >&2
            exit 1
          fi

          payload="$(
            jq -n \
              --arg title "$PR_TITLE" \
              --arg url "$PR_URL" \
              --arg author "$PR_AUTHOR" \
              --arg number "$PR_NUMBER" \
              --arg merged_by "$MERGED_BY" \
              '{
                "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                type: "AdaptiveCard",
                version: "1.4",
                body: [
                  {
                    type: "TextBlock",
                    size: "Medium",
                    weight: "Bolder",
                    text: "Xeon report merged",
                    wrap: true
                  },
                  {
                    type: "TextBlock",
                    text: ("PR #" + $number + ": " + $title),
                    wrap: true
                  },
                  {
                    type: "FactSet",
                    facts: [
                      {title: "Author", value: ("@" + $author)},
                      {title: "Merged by", value: ("@" + $merged_by)}
                    ]
                  }
                ],
                actions: [
                  {
                    type: "Action.OpenUrl",
                    title: "View pull request",
                    url: $url
                  }
                ]
              }'
          )"

          curl --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$payload" \
            --write-out "\nTeams webhook HTTP status: %{http_code}\n" \
            "$TEAMS_WEBHOOK_URL"
