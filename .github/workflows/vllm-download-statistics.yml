name: Collect vLLM download statistics

on:
  schedule:
    - cron: "15 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vllm-download-statistics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore protected-branch history if present
        shell: bash
        run: |
          data_branch="automation/vllm-download-statistics-report"
          if git fetch origin "${data_branch}:refs/remotes/origin/${data_branch}"; then
            git checkout "origin/${data_branch}" -- data/vllm-downloads || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependency
        run: python -m pip install requests

      - name: Collect statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/collect_vllm_downloads.py

      - name: Publish run summary
        shell: bash
        run: cat data/vllm-downloads/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload collection outputs
        uses: actions/upload-artifact@v4
        with:
          name: vllm-download-statistics-${{ github.run_id }}
          path: data/vllm-downloads/
          retention-days: 30

      - name: Commit and persist statistics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- data/vllm-downloads; then
            echo "No statistics changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vllm-downloads
          git commit -m "Update vLLM download statistics"

          report_branch="automation/vllm-download-statistics-report"
          git push --force-with-lease origin "HEAD:refs/heads/${report_branch}"

          if git push origin HEAD:main; then
            exit 0
          fi

          echo "Direct push was blocked; persisting through an automation PR"
          data_branch="automation/vllm-download-statistics-report"
          git push --force-with-lease origin "HEAD:refs/heads/${data_branch}"
          if [[ -z "$(gh pr list --head "${data_branch}" --base main --state open --json number --jq '.[0].number')" ]]; then
            gh pr create \
              --base main \
              --head "${data_branch}" \
              --title "Update vLLM download statistics" \
              --body "Automated cumulative vLLM distribution-counter snapshots. This PR is used because direct workflow write-back to main is blocked by repository rules."
          fi
